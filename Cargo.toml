[package]
name = "on-call-support"
version = "0.9.0"
edition = "2024"

[profile.release]
opt-level = "s"
codegen-units = 16
lto = "thin"
strip = true
panic = "abort"

[dependencies]
async-trait = "0.1.92"
aws_lambda_events = { version = "1.2.1", default-features = false, features = ["apigw"] }
aws-config = { version = "1.13.2", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-cloudformation = { version = "1.139.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1.139.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-kms = { version = "1.131.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-lambda = { version = "1.159.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-scheduler = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = {  version="1.128.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"]}
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = ["rustls-aws-lc"] }
base64 = "0.23.1"
chacha20poly1305 = {version="0.11.0", features = ["getrandom"]}
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["std", "case-insensitive", "serde"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
cron = "0.17.0"
derive_more = {version = "2.1.1", features=["full"]}
futures = "0.3.34"
hex = "0.4.3"
lambda_runtime = "1.5.0"
lazy_static = "1.5.1"
regex = "1.13.1"
reqwest = {version="0.13", default-features = false, features=["gzip", "json", "query", "rustls"]}
aws-lc-rs = "1.19.0"
rsb_derive = "0.5.4"
rvstruct = "0.3.4"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_urlencoded = "0.7.1"
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros", "json"] }
shlex = "2.0.1"
slack-morphism = "2.32"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "^1.54.1", features=["rt-multi-thread", "macros", "sync"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "tracing-log", "json"] }

[dev-dependencies]
aws-sdk-cloudformation = {version="1.139.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"]}
aws-sdk-dynamodb = {version="1.139.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"]}
aws-sdk-scheduler = {version="1.122.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"]}
aws-sdk-secretsmanager = {version="1.128.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"]}
aws-sdk-kms = {version="1.131.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"]}
aws-smithy-mocks = "0.3.0"
pretty_assertions = "1.4"
wiremock = "0.6"
